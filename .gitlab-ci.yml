default:
  tags: [docker-internal]

stages:
  - prepare
  - build
  - deploy

variables:
  # FLUTTER_VERSION and ANDROID_CI_IMAGE are not set here on purpose: the
  # ci_image job derives them from .fvmrc and passes them on as a dotenv
  # artifact, so .fvmrc stays the single source of truth for every job.
  #
  # GitLab Secure Files (key.properties, upload keystore, Play service account)
  # are downloaded into the project root before every build.
  SECURE_FILES_DOWNLOAD_PATH: '.'
  # Flutter ships with the image; the pipeline only verifies the version.
  FLUTTER_HOME: '/opt/flutter'
  GRADLE_USER_HOME: '$CI_PROJECT_DIR/.gradle'
  PUB_CACHE: '$CI_PROJECT_DIR/.pub-cache'

ci_image:
  # Derives the Flutter version from .fvmrc, makes sure a matching toolchain
  # image exists in the registry, and hands both on to every following job.
  #
  # Runs on the macOS shell runner because it can talk to the Docker daemon
  # directly — no docker-in-docker, no privileged container needed.
  stage: prepare
  tags: [ios-build-server]
  artifacts:
    reports:
      dotenv: ci_image.env
  script:
    - FLUTTER_VERSION=$(sed -n 's/.*"flutter"[^"]*"\([^"]*\)".*/\1/p' .fvmrc)
    - |
      if [ -z "$FLUTTER_VERSION" ]; then
        echo "error: could not read Flutter version from .fvmrc" >&2
        exit 1
      fi
    - ANDROID_CI_IMAGE="$CI_REGISTRY_IMAGE/android-ci:$FLUTTER_VERSION"
    # Hand both down to the build and deploy jobs, including their image:.
    - printf 'FLUTTER_VERSION=%s\nANDROID_CI_IMAGE=%s\n' "$FLUTTER_VERSION" "$ANDROID_CI_IMAGE" > ci_image.env
    - cat ci_image.env
    - echo "$CI_TOKEN" | docker login "$CI_REGISTRY" -u "$CI_USER" --password-stdin
    - |
      if docker manifest inspect "$ANDROID_CI_IMAGE" > /dev/null 2>&1; then
        echo "$ANDROID_CI_IMAGE already in the registry — using it as-is"
        exit 0
      fi
      echo "No image for Flutter $FLUTTER_VERSION yet — building it once."
      echo "This runs under Rosetta and will take a while; later pipelines reuse it."
      # --provenance=false keeps buildx from emitting an attestation manifest
      # list, which the registry does not need and not every version digests.
      docker build --platform linux/amd64 --provenance=false \
        --build-arg FLUTTER_VERSION="$FLUTTER_VERSION" \
        -t "$ANDROID_CI_IMAGE" \
        -f ci_scripts/Dockerfile.android .
    - |
      # Large blobs occasionally fail mid-upload ("resumable blob upload
      # invalid"). Already-pushed layers are skipped, so retrying makes
      # progress instead of starting over.
      for attempt in 1 2 3; do
        if docker push "$ANDROID_CI_IMAGE"; then
          echo "Pushed $ANDROID_CI_IMAGE"
          exit 0
        fi
        echo "Push attempt $attempt failed — retrying in 15s"
        sleep 15
      done
      echo "error: could not push $ANDROID_CI_IMAGE after 3 attempts" >&2
      exit 1

.android_build:
  image: $ANDROID_CI_IMAGE
  stage: build
  # Pulls FLUTTER_VERSION and ANDROID_CI_IMAGE in via ci_image's dotenv report.
  needs: [ci_image]
  cache:
    - key: "gradle-$CI_COMMIT_REF_SLUG"
      paths:
        - .gradle/
        - .pub-cache/
  artifacts:
    name: Packages
    paths:
      - output/
    expire_in: 1 week
  before_script:
    # Installs the Flutter version pinned in .fvmrc — same source of truth as
    # ios/ci_scripts/ci_post_clone.sh uses for Xcode Cloud.
    - ./ci_scripts/install_flutter_linux.sh
    - export PATH="$FLUTTER_HOME/bin:$PATH"
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - flutter pub get
  after_script:
    - mkdir -p output
    - cp build/app/outputs/apk/release/app-release.apk output/ 2>/dev/null || true
    - cp build/app/outputs/bundle/release/app-release.aab output/ 2>/dev/null || true

android_feature_manual:
  extends: .android_build
  rules:
    # Everything except dev, main and tags — on demand only.
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: manual
      allow_failure: true
  script:
    - flutter build apk --no-tree-shake-icons --build-name=dev --build-number=$CI_PIPELINE_IID
    - flutter build appbundle --no-tree-shake-icons --build-name=dev --build-number=$CI_PIPELINE_IID

android_development:
  extends: .android_build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - flutter build apk --no-tree-shake-icons --build-name=dev --build-number=$CI_PIPELINE_IID
    - flutter build appbundle --no-tree-shake-icons --build-name=dev --build-number=$CI_PIPELINE_IID

android_release:
  extends: .android_build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - flutter build apk --no-tree-shake-icons --build-name=release --build-number=$CI_PIPELINE_IID
    - flutter build appbundle --no-tree-shake-icons --build-name=release --build-number=$CI_PIPELINE_IID

android_tag:
  extends: .android_build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Strip a leading "v" so the Play Store version name stays clean (v1.6.0 -> 1.6.0).
    - VERSION="${CI_COMMIT_TAG#v}"
    - flutter build apk --no-tree-shake-icons --build-name=$VERSION --build-number=$CI_PIPELINE_IID
    - flutter build appbundle --no-tree-shake-icons --build-name=$VERSION --build-number=$CI_PIPELINE_IID

play_internal:
  # Same image as the build jobs — fastlane is baked in, no gem install per run.
  image: $ANDROID_CI_IMAGE
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  # ci_image supplies the image name, android_tag the bundle to upload.
  needs: [ci_image, android_tag]
  variables:
    AAB_PATH: '$CI_PROJECT_DIR/output/app-release.aab'
    SUPPLY_JSON_KEY: '$CI_PROJECT_DIR/play-store-service-account.json'
  before_script:
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
  script:
    - cd android && fastlane internal

play_production:
  image: $ANDROID_CI_IMAGE
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: true
  # ci_image again for the image name — dotenv is not passed on transitively.
  needs: [ci_image, play_internal]
  variables:
    SUPPLY_JSON_KEY: '$CI_PROJECT_DIR/play-store-service-account.json'
  before_script:
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
  script:
    - cd android && fastlane promote_production

gitlab_release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  needs: [android_tag]
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: $CI_COMMIT_TAG
    ref: $CI_COMMIT_SHA
    assets:
      links:
        - name: APK
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/output/app-release.apk?job=android_tag'
        - name: AAB
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/output/app-release.aab?job=android_tag'
