default:
  tags:
    - ios-build-server

stages:
  - build
  - release

variables:
  # GitLab Secure Files (key.properties, upload keystore, Play service account)
  # are downloaded into the project root before every build.
  SECURE_FILES_DOWNLOAD_PATH: '.'

.android_build_template: &android_build_template
  artifacts:
    name: Packages
    paths:
      - $CI_PROJECT_DIR/output
    expire_in: 1 week
  before_script:
    - export ANDROID_HOME="$HOME/Library/Android/sdk"
    - export ANDROID_SDK_ROOT="$ANDROID_HOME"
    # macOS ships only a Java stub; the real JDK comes with Android Studio.
    - export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
    - export PATH="$JAVA_HOME/bin:$PATH"
    # fvm reads .fvmrc, so the Flutter version stays in one place — same source
    # of truth that ios/ci_scripts/ci_post_clone.sh uses for Xcode Cloud.
    - fvm install
    - fvm flutter --version
    - fvm flutter pub get
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
  after_script:
    - mkdir -p $CI_PROJECT_DIR/output
    - cp $CI_PROJECT_DIR/build/app/outputs/apk/release/app-release.apk $CI_PROJECT_DIR/output/ 2>/dev/null || true
    - cp $CI_PROJECT_DIR/build/app/outputs/bundle/release/app-release.aab $CI_PROJECT_DIR/output/ 2>/dev/null || true

android_feature:
  <<: *android_build_template
  stage: build
  except:
    - dev
    - main
    - tags
  when: manual
  script:
    - fvm flutter build apk --no-tree-shake-icons --build-name=dev --build-number=$CI_PIPELINE_IID
    - fvm flutter build appbundle --no-tree-shake-icons --build-name=dev --build-number=$CI_PIPELINE_IID

android_development:
  <<: *android_build_template
  stage: build
  only:
    - dev
  script:
    - fvm flutter build apk --no-tree-shake-icons --build-name=dev --build-number=$CI_PIPELINE_IID
    - fvm flutter build appbundle --no-tree-shake-icons --build-name=dev --build-number=$CI_PIPELINE_IID

android_release:
  <<: *android_build_template
  stage: build
  only:
    - main
  script:
    - fvm flutter build apk --no-tree-shake-icons --build-name=release --build-number=$CI_PIPELINE_IID
    - fvm flutter build appbundle --no-tree-shake-icons --build-name=release --build-number=$CI_PIPELINE_IID

android_appstore:
  <<: *android_build_template
  stage: release
  only:
    - tags
  script:
    - glab auth login --hostname $CI_SERVER_HOST --job-token $CI_JOB_TOKEN
    # Strip a leading "v" so the Play Store version name stays clean (v1.6.0 -> 1.6.0).
    - VERSION="${CI_COMMIT_TAG#v}"
    - fvm flutter build apk --no-tree-shake-icons --build-name=$VERSION --build-number=$CI_PIPELINE_IID
    - fvm flutter build appbundle --no-tree-shake-icons --build-name=$VERSION --build-number=$CI_PIPELINE_IID
    # Upload the bundle to the Play Store internal track.
    - export SUPPLY_JSON_KEY="$CI_PROJECT_DIR/play-store-service-account.json"
    - export AAB_PATH="$CI_PROJECT_DIR/build/app/outputs/bundle/release/app-release.aab"
    - cd android && fastlane internal && cd ..
    - |
      glab release create "$CI_COMMIT_TAG" \
        --notes "$CI_COMMIT_TAG" \
        --ref "$CI_COMMIT_SHA" \
        --assets-links='[
          {
            "name": "APK",
            "url": "'"$CI_JOB_URL"'/artifacts/file/output/app-release.apk",
            "link_type": "other"
          },
          {
            "name": "AAB",
            "url": "'"$CI_JOB_URL"'/artifacts/file/output/app-release.aab",
            "link_type": "other"
          }
        ]'

play_production:
  stage: release
  only:
    - tags
  when: manual
  needs:
    - android_appstore
  before_script:
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
  script:
    - export SUPPLY_JSON_KEY="$CI_PROJECT_DIR/play-store-service-account.json"
    - cd android && fastlane promote_production
